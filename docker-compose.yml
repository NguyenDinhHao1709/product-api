services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  product-api:
    build: .
    container_name: product-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/product_db
    depends_on:
      - mongodb

volumes:
  mongo_data:
